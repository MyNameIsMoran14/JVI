services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: med
      POSTGRES_PASSWORD: med
      POSTGRES_DB: med
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - files_data:/data/files
    depends_on:
      - postgres
      - redis
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  bot:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - files_data:/data/files
    depends_on:
      - postgres
      - redis
    command: python -m app.bot.main

  worker:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - files_data:/data/files
    depends_on:
      - postgres
      - redis
    command: arq app.worker.WorkerSettings

  frontend-build:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../frontend:/app
      - frontend_dist:/app/dist
    command: sh -c "npm install && npm run build"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  files_data:
  frontend_dist:
  caddy_data:
  caddy_config:
