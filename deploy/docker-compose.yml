# Caddy добавится на этапе 4 плана (docs/PROJECT_SPEC.md, раздел 11).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: med
      POSTGRES_PASSWORD: med
      POSTGRES_DB: med
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - files_data:/data/files
    depends_on:
      - postgres
      - redis
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  bot:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - files_data:/data/files
    depends_on:
      - postgres
      - redis
    command: python -m app.bot.main

  worker:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - files_data:/data/files
    depends_on:
      - postgres
      - redis
    command: arq app.worker.WorkerSettings

volumes:
  postgres_data:
  redis_data:
  files_data:
